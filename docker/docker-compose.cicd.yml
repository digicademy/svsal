# CI/CD Docker Compose Configuration for SvSal
# Lightweight setup for derivative file generation workflows
#
# This configuration includes only the services needed for CI/CD pipelines:
# - existdb: for running webdata-admin.xql to generate derivatives
# - any23: for RDF extraction from TEI/XML
#
# Usage:
#   docker-compose -f docker-compose.cicd.yml up -d
#   # Run derivative generation scripts
#   docker-compose -f docker-compose.cicd.yml down
#
# Required environment variables (set in your CI/CD platform):
#   - EXISTDB_ADMIN_PASSWORD: Admin password for eXist-db
#   - SSH_PRIVATE_KEY: SSH private key for rsync to webserver (if using)
#   - WEBSERVER_HOST: Target webserver hostname (if using rsync)
#   - WEBSERVER_USER: SSH user for webserver (if using rsync)
#
# Note: SSH_KNOWN_HOSTS is optional. Use ssh-keyscan or -o StrictHostKeyChecking=no

version: '3.8'

services:
  existdb:
    image: ghcr.io/digicademy/svsal/svsal-exist:3.0rc2
    container_name: existdb-cicd
    restart: "no"
    environment:
      # Reduced memory for CI/CD environments
      JAVA_TOOL_OPTIONS: '-Xmx4g -Xms2g -XX:MaxRAMPercentage=75.0'
      # Optional: Set admin password via environment variable
      # EXIST_PASS: ${EXISTDB_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      # Mount TEI source files from repository (adjust path as needed)
      # - ./tei-sources:/tei-sources:ro
      # Output directory for generated derivatives (will be rsync'd to webserver)
      - existexport:/exist/data/export
      - logs:/exist/logs
    networks:
      - cicd-network

  any23:
    image: ghcr.io/digicademy/svsal/svsal-any23:2.3rc2
    container_name: any23-cicd
    restart: "no"
    ports:
      - "8082:8082"
    networks:
      - cicd-network

volumes:
  existexport:
    driver: local
    name: existexport-cicd
  logs:
    driver: local
    name: logs-cicd

networks:
  cicd-network:
    driver: bridge
    name: cicd-network
